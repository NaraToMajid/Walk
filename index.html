<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#mbtn{position:fixed;z-index:10;left:max(2vh,env(safe-area-inset-left));top:max(2vh,env(safe-area-inset-top));width:44px;height:44px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);backdrop-filter:blur(6px);display:grid;place-items:center;touch-action:none}

#mpan{position:fixed;z-index:10;left:max(2vh,env(safe-area-inset-left));top:calc(max(2vh,env(safe-area-inset-top)) + 54px);width:min(340px,70vw);max-height:calc(100% - 90px);display:flex;flex-direction:column;border-radius:18px;border:1px solid rgba(255,255,255,.25);background:rgba(8,12,24,.84);backdrop-filter:blur(10px)}

#ml{overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;padding:6px}

.sg{display:flex;align-items:center;gap:10px;width:100%;padding:6px;border:0;border-radius:12px;background:none;text-align:left;font-size:15px}
.sg.on{background:rgba(255,255,255,.12)}
.sg i{flex:none;width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,#27406e,#5b3a7a) center/cover;display:grid;place-items:center;font-style:normal;font-size:13px}
.sg i::after{content:'\25B6';text-shadow:0 0 6px #000;opacity:0}
.sg.on i::after{opacity:1}
.sg.pl i::after{content:'\275A\275A'}
.sg b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mft{display:flex;gap:8px;padding:8px;border-top:1px solid rgba(255,255,255,.15)}

#ver{margin-top:1.6em;font-size:clamp(11px,2.6vh,14px);letter-spacing:.14em;opacity:.55}

#sit[hidden]{display:none}
#menu h1{margin-bottom:.5em}
#cbtn,#sbtn{position:absolute;top:max(2vh,env(safe-area-inset-top));height:44px;border-radius:99px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);backdrop-filter:blur(6px);pointer-events:auto;touch-action:none;font-size:13px;letter-spacing:.06em}
#sbtn{right:max(2vh,env(safe-area-inset-right));width:44px;display:grid;place-items:center;padding:0}
#sbtn svg{width:22px;fill:none;stroke:#e8eefc;stroke-width:1.6;stroke-linecap:round}
#cbtn{right:calc(max(2vh,env(safe-area-inset-right)) + 54px);padding:0 1.1em}
#spn{position:absolute;pointer-events:auto;right:max(2vh,env(safe-area-inset-right));top:calc(max(2vh,env(safe-area-inset-top)) + 54px);width:min(300px,62vw);padding:14px;border-radius:18px;border:1px solid rgba(255,255,255,.25);background:rgba(8,12,24,.86);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:12px;font-size:15px}

:root{--r:min(18vh,92px);--e:max(6vh,env(safe-area-inset-right))}
#cbtn{right:calc(max(2vh,env(safe-area-inset-right)) + 108px)}
#kbtn{position:absolute;top:max(2vh,env(safe-area-inset-top));right:calc(max(2vh,env(safe-area-inset-right)) + 54px);width:44px;height:44px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);backdrop-filter:blur(6px);pointer-events:auto;touch-action:none;font-size:18px}
#jmp,#ebtn{position:absolute;bottom:10vh;width:var(--r);aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);backdrop-filter:blur(4px);pointer-events:auto;touch-action:none;font-size:14px}
#jmp{right:calc(var(--e) + var(--r) + 12px)}#ebtn{right:calc(var(--e) + 2*var(--r) + 24px);font-size:30px}
#acts{position:absolute;right:var(--e);bottom:calc(10vh + var(--r) + 14px);display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}

.ab{padding:.5em 1.1em;border-radius:99px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);backdrop-filter:blur(4px);pointer-events:auto;font-size:14px;touch-action:none}
.ab[hidden]{display:none}
#epan{position:absolute;left:50%;bottom:calc(10vh + 4px);transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:62vw;padding:8px;border-radius:18px;border:1px solid rgba(255,255,255,.25);background:rgba(8,12,24,.88);backdrop-filter:blur(10px);pointer-events:auto}

#nm{font:inherit;font-size:15px;color:inherit;padding:.5em .9em;margin-bottom:4px;border-radius:99px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);user-select:text;-webkit-user-select:text;outline:0}
.ks{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid transparent;border-radius:12px;background:none;font-size:15px;text-align:left}
.ks.on{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4)}
.ks i{width:26px;height:26px;flex:none;border-radius:50%;border:3px solid}
#emo{position:absolute;left:50%;top:36%;font-size:min(24vh,130px);transform:translate(-50%,-50%);pointer-events:none;opacity:0}
#emo.show{animation:pop 2.8s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.3)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
#onl{position:absolute;left:50%;transform:translateX(-50%);top:max(2vh,env(safe-area-inset-top));height:44px;display:flex;align-items:center;font-size:12px;letter-spacing:.08em;opacity:.7;pointer-events:none}
#ld{z-index:20;background:#02040c;gap:14px;transition:opacity .8s}#ld.off{opacity:0;pointer-events:none}
#lb{width:min(60vw,320px);height:6px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
#lb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fe6c0,#ffb8d2);transition:width .25s}
#go:disabled{opacity:.5;cursor:wait}
#chb{position:absolute;bottom:10vh;width:var(--r);aspect-ratio:1;right:calc(var(--e) + 3*var(--r) + 36px);border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);backdrop-filter:blur(4px);pointer-events:auto;touch-action:none;font-size:28px}
#cin{position:absolute;left:50%;bottom:calc(10vh + 4px);transform:translateX(-50%);display:flex;gap:6px;width:min(60vw,420px);pointer-events:auto}#cin[hidden]{display:none}
#ci{flex:1;min-width:0;font:inherit;font-size:16px;color:inherit;padding:.6em 1em;border-radius:99px;border:1px solid rgba(255,255,255,.35);background:rgba(8,12,24,.88);user-select:text;-webkit-user-select:text;outline:0}
#cs{padding:.5em 1.1em;border-radius:99px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14)}
#clog{position:absolute;left:max(2vh,env(safe-area-inset-left));top:calc(max(2vh,env(safe-area-inset-top)) + 54px);display:flex;flex-direction:column;gap:3px;max-width:min(46vw,340px);font-size:13px;pointer-events:none}
#clog div{padding:3px 9px;border-radius:10px;background:rgba(8,12,24,.55);word-break:break-word;animation:cf 14s forwards}
@keyframes cf{0%,85%{opacity:1}100%{opacity:0}}
</style></head><body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script type="module">
const $=i=>document.getElementById(i),rnd=Math.random,R=200,PI=Math.PI;
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const pc=z=>22*Math.sin(z*.028)*(1-sm(R-70,R-26,z));
const pd=(x,z)=>{const r=Math.hypot(x,z);return Math.min(r<15?0:99,Math.abs(r-62),Math.abs(r-122),z>6&&z<R-10?Math.abs(x-pc(z)):99)}; // jarak ke jalan setapak
const H=(x,z)=>{const r=Math.hypot(x,z),a=Math.atan2(z,x),t=sm(0,1,(R+7*Math.sin(a*3+1)+4*Math.sin(a*5+2)-r)/24);
 const h=t*(1.6+1.3*Math.sin(x*.03+1)*Math.cos(z*.027)+.9*Math.sin(z*.07+x*.05)*Math.cos(x*.06)+.4*Math.sin(x*.19)*Math.cos(z*.17))-2.8*(1-t);
 const o=h+(1.5-h)*(1-sm(11,19,r));return o+(1.5-o)*(1-sm(1.8,5,pd(x,z)))*(1-sm(R-34,R-26,r))}; // jalan setapak diratakan, tidak pernah tenggelam
const path=(x,z)=>pd(x,z)<2.3;
const pier=(x,z)=>Math.abs(x)<1.9&&z>R-22&&z<R+14;
const benches=[],trees=[],pinkT=[];
const ok=(x,z)=>Math.hypot(x,z)>5.4&&(pier(x,z)||H(x,z)>.25)&&trees.every(t=>(x-t[0])**2+(z-t[1])**2>.5)&&benches.every(b=>{const d=Math.hypot(x-b.x,z-b.z);return d>1.1||d>=Math.hypot(pos.x-b.x,pos.z-b.z)});

const tick=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0))),PG=async(p,t)=>{$('lb').firstElementChild.style.width=p+'%';$('lt2').textContent=t+' '+p+'%';await tick()};
await PG(3,'Menyiapkan');
/* ---------- scene ---------- */
const cv=$('c'),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true}),scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(70,1,.1,2000);
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setClearColor(0x0f1f3d);
scene.fog=new THREE.FogExp2(0x0f1f3d,.0034);cam.rotation.order='YXZ';scene.add(cam);
const skyG=new THREE.Group();scene.add(skyG);
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
 g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const glow=(col,s,op)=>{const m=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:col,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:op}));m.scale.set(s,s,1);return m};

skyG.add(new THREE.Mesh(new THREE.SphereGeometry(500,32,24),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
 vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`varying vec3 p;
 float h(vec3 q){return fract(sin(dot(q,vec3(12.9898,78.233,37.719)))*43758.5453);}
 float n(vec3 q){vec3 i=floor(q),f=fract(q);f=f*f*(3.-2.*f);
  return mix(mix(mix(h(i),h(i+vec3(1.,0.,0.)),f.x),mix(h(i+vec3(0.,1.,0.)),h(i+vec3(1.,1.,0.)),f.x),f.y),
             mix(mix(h(i+vec3(0.,0.,1.)),h(i+vec3(1.,0.,1.)),f.x),mix(h(i+vec3(0.,1.,1.)),h(i+vec3(1.,1.,1.)),f.x),f.y),f.z);}
 void main(){vec3 d=normalize(p);float y=clamp(d.y,0.,1.);
  vec3 c=mix(vec3(.07,.15,.27),vec3(.004,.008,.03),pow(y,.4));
  c+=vec3(.05,.09,.12)*pow(1.-y,6.);
  float q=dot(d,normalize(vec3(.35,.75,.55)));
  float m=n(d*5.)*.6+n(d*13.)*.3+n(d*31.)*.1;
  float vis=smoothstep(0.,.25,d.y+.1);
  c+=(vec3(.5,.55,.85)*exp(-q*q*14.)+vec3(.9,.75,.6)*exp(-q*q*60.)*.35)*m*.35*vis;
  gl_FragColor=vec4(c,1.);}`})));

// stars
const M=4500,sp=new Float32Array(M*3),sc=new Float32Array(M*3),sph=new Float32Array(M),ssz=new Float32Array(M);
for(let i=0;i<M;i++){const y=.03+rnd()*.97,q=Math.sqrt(1-y*y),a=rnd()*PI*2,w=rnd();
 sp.set([Math.cos(a)*q*480,y*480,Math.sin(a)*q*480],i*3);
 sc.set(w<.6?[.85,.9,1]:w<.85?[1,.95,.8]:[.7,.8,1],i*3);sph[i]=rnd()*6.28;ssz[i]=1.2+Math.pow(rnd(),5)*3;}
const sg=new THREE.BufferGeometry();
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));sg.setAttribute('col',new THREE.BufferAttribute(sc,3));
sg.setAttribute('ph',new THREE.BufferAttribute(sph,1));sg.setAttribute('sz',new THREE.BufferAttribute(ssz,1));
const su={t:{value:0},dpr:{value:ren.getPixelRatio()}};
skyG.add(new THREE.Points(sg,new THREE.ShaderMaterial({uniforms:su,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:'attribute vec3 col;attribute float ph,sz;uniform float t,dpr;varying vec3 c;void main(){c=col;gl_PointSize=sz*dpr*(.85+.25*sin(t*2.+ph*7.));gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 c;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;gl_FragColor=vec4(c,1.-d*1.8);}'})));

// moon
const mp=new THREE.Vector3(-190,200,-370),moon=new THREE.Mesh(new THREE.SphereGeometry(13,24,16),new THREE.MeshBasicMaterial({color:0xf2efe0,fog:false}));
moon.position.copy(mp);skyG.add(moon);const mh=glow(0x9fb6ff,170,.4);mh.position.copy(mp);skyG.add(mh);

// aurora
const au=[];
function aur(a0,a1,rad,y0,hg,c1,c2,ph,k){
 const g=new THREE.PlaneGeometry(1,1,160,12),P=g.attributes.position;
 for(let i=0;i<P.count;i++){const u=P.getX(i)+.5,v=P.getY(i)+.5,a=a0+(a1-a0)*u,r=rad+34*Math.sin(u*8+ph)+14*Math.sin(u*21+ph*2);
  P.setXYZ(i,Math.cos(a)*r,y0+v*hg*(1+.25*Math.sin(u*6+ph))+10*Math.sin(u*5+ph+v),Math.sin(a)*r)}
 const m=new THREE.ShaderMaterial({uniforms:{t:{value:0},ph:{value:ph},k:{value:k},c1:{value:new THREE.Vector3(...c1)},c2:{value:new THREE.Vector3(...c2)}},
